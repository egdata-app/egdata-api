name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 1
      CARGO_PROFILE_DEV_DEBUG: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Rust toolchain
        working-directory: rust
        run: |
          TOOLCHAIN="$(rustup show active-toolchain | awk '{print $1}')"
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: openapi
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # NOTE: `pnpm biome check .` and `pnpm typecheck` are intentionally
      # not gated in CI yet — the repo has pre-existing lint/type errors
      # that need a separate cleanup pass. Run them locally when working
      # in the affected areas. CI gates on build, unit tests, docs, and contracts.

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test

      - name: OpenAPI contract check
        run: pnpm openapi:check

      - name: Docs build
        run: pnpm docs:build

      - name: Docs and README checks
        run: |
          pnpm docs:check
          pnpm readme:check

      - name: Release policy check
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          BASE="${PR_BASE:-$PUSH_BASE}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Main's changes already passed the PR/push coverage check. Revalidate
            # current records and generated output without inventing a PR base.
            BASE="$(git rev-parse HEAD)"
          fi
          test -n "$BASE"
          export CHANGELOG_BASE="$(git merge-base "$BASE" HEAD)"
          pnpm release:check

      - name: Dashboard tests and build
        run: |
          pnpm dashboard:test
          pnpm dashboard:build
