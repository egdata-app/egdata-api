# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
tone_instructions: "Be direct, concise, and specific. Prioritize correctness, public API compatibility, security, and missing documentation."

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  review_details: true
  poem: false
  in_progress_fortune: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!dist/**"
    - "!apps/docs/dist/**"
    - "!apps/docs/.wrangler/**"
    - "!apps/docs/node_modules/**"
    - "!apps/docs/.source/**"
  path_instructions:
    - path: "src/routes/**/*.{ts,tsx}"
      instructions: |
        Treat these files as public REST endpoint handlers. Focus on request validation, authentication behavior, cache key correctness, response shape stability, status codes, pagination, filtering, sorting, regional behavior, and error semantics.

        For any structural public endpoint change, require matching documentation updates in `apps/docs/`, OpenAPI updates under `openapi/` or `src/openapi/`, and validated change records covering every affected stable operation ID. Structural changes include adding, removing, or renaming routes, methods, query/path/body parameters, filters, sort options, response fields, response status codes, auth requirements, documented error behavior, pagination behavior, or deprecations.
    - path: "src/openapi/**/*.{ts,json}"
      instructions: |
        Ensure the OpenAPI contract stays synchronized with the route implementation and the public docs in `apps/docs/`. Flag missing request parameters, response fields, auth metadata, visibility metadata, examples, and stale generated output.
    - path: "openapi/**/*.json"
      instructions: |
        Review generated OpenAPI output for consistency with `src/openapi/`, route behavior, and `apps/docs/`. Flag stale or incomplete contract snapshots.
    - path: "apps/docs/**/*.{md,mdx,ts,tsx,json,jsonc}"
      instructions: |
        Review documentation for public API accuracy. When endpoint structure changes, verify the docs describe the new request parameters, filters, response fields, auth requirements, errors, pagination, deprecations, and examples. Cross-check against OpenAPI where applicable.
    - path: "changes/**"
      instructions: |
        Validate concrete before/after behavior, stable endpoint identities, compatibility, migration instructions, and verification. Merged records are append-only. Corrections use new IDs. Historical undated notes never create alerts.
  pre_merge_checks:
    custom_checks:
      - mode: "error"
        name: "Endpoint impact coverage"
        instructions: |
          Require current validated operation-level assessments for API, contract, middleware, and gateway changes. Public behavior changes require records covering every affected operation; no-impact explanations cannot override resolved structural contract changes. Review semantic equivalence for behavior-only changes. Require docs and OpenAPI for structural changes. Documentation-only and unrelated maintenance need no public entries. No bypass labels. Check generated histories and immutable records.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/release-policy.md"

chat:
  auto_reply: true
